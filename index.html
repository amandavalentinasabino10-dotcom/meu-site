<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mídia Up - Agência de marketing digital, comunicação e engenharia web." />
  <title>Mídia Up — Sua marca em outro nível</title>
  <style>
    :root {
      --bg-void: #000000;
      --bg-navy: #050a18;
      --bg-glass: rgba(13, 21, 40, 0.65);
      --bg-glass-hover: rgba(20, 32, 62, 0.85);
      --blue-electric: #2563eb;
      --cyan-neon: #00f0ff;
      --cyan-soft: rgba(0, 240, 255, 0.14);
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-bright: rgba(0, 240, 255, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --radius-lg: 18px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(37, 99, 235, 0.18) 0%, transparent 42%),
        radial-gradient(circle at 88% 25%, rgba(0, 240, 255, 0.12) 0%, transparent 38%),
        radial-gradient(circle at 50% 85%, rgba(37, 99, 235, 0.14) 0%, transparent 48%);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Cabeçalho */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 10, 24, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-glass);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 74px;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo span {
      color: var(--cyan-neon);
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--cyan-neon);
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-electric), #0284c7);
      color: #fff;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.55);
    }

    .btn-outline {
      background: var(--bg-glass);
      color: var(--cyan-neon);
      border: 1px solid var(--border-bright);
    }

    .btn-outline:hover {
      background: var(--cyan-soft);
    }

    /* Hero */
    .hero {
      padding: 6rem 0 4.5rem;
      text-align: center;
    }

    .badge-pill {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: var(--cyan-soft);
      border: 1px solid var(--border-bright);
      color: var(--cyan-neon);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.75rem);
      font-weight: 800;
      line-height: 1.15;
      max-width: 820px;
      margin: 0 auto 1.25rem;
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--cyan-neon), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 1.12rem;
      max-width: 640px;
      margin: 0 auto 2.2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Seções e Grids */
    section {
      padding: 4.5rem 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: 2rem;
      margin-bottom: 0.6rem;
    }

    .section-header p {
      color: var(--text-secondary);
      max-width: 580px;
      margin: 0 auto;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.9rem;
      transition: var(--transition);
    }

    .card:hover {
      background: var(--bg-glass-hover);
      border-color: var(--border-bright);
      transform: translateY(-5px);
    }

    .card-tag {
      display: inline-block;
      color: var(--cyan-neon);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-secondary);
      font-size: 0.96rem;
    }

    /* Diferenciais */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }

    .badge-box {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.3rem;
      text-align: center;
    }

    .badge-box strong {
      display: block;
      font-size: 1.4rem;
      color: var(--cyan-neon);
      margin-bottom: 0.25rem;
    }

    .badge-box small {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Abas de Atendimento (Solicitar Proposta e Falar com a Equipe) */
    .atendimento-box {
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      max-width: 760px;
      margin: 0 auto;
    }

    .tabs-header {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 1.25rem;
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn:hover {
      border-color: var(--border-bright);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--blue-electric), #0284c7);
      color: #ffffff;
      border-color: var(--cyan-neon);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field-group {
      margin-bottom: 1.35rem;
      text-align: left;
    }

    .field-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--cyan-neon);
      margin-bottom: 0.45rem;
    }

    .info-field,
    .select-field {
      width: 100%;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      background: rgba(5, 10, 24, 0.9);
      border: 1px solid var(--border-bright);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
    }

    .info-field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .info-field a {
      color: var(--cyan-neon);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: var(--cyan-soft);
      border: 1px solid var(--border-bright);
    }

    .info-field a:hover {
      background: var(--cyan-neon);
      color: #000;
    }

    .team-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.85rem;
      margin-top: 1.25rem;
    }

    .team-item {
      background: rgba(5, 10, 24, 0.85);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      transition: var(--transition);
    }

    .team-item:hover {
      border-color: var(--border-bright);
    }

    .team-item strong {
      display: block;
      color: var(--cyan-neon);
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    .team-item span {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    footer {
      border-top: 1px solid var(--border-glass);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    @media (max-width: 720px) {
      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <a href="#" class="logo">Mídia<span>Up</span></a>
      <ul class="nav-links">
        <li><a href="#servicos">Serviços</a></li>
        <li><a href="#diferenciais">Diferenciais</a></li>
        <li><a href="#atendimento" onclick="abrirAba('proposta')">Solicitar Proposta</a></li>
      </ul>
