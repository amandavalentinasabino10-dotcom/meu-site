<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mídia Up — Agência de marketing digital, comunicação e engenharia web. Proposta acadêmica de evolução digital para a Deck | FSB Holding." />
  <title>Mídia Up — Sua marca em outro nível.</title>
  <style>
    :root {
      --bg-void: #03060d;
      --bg-navy: #070d1b;
      --bg-glass: rgba(13, 23, 46, 0.65);
      --bg-glass-hover: rgba(18, 32, 62, 0.82);
      --blue-electric: #2563eb;
      --cyan-neon: #00f0ff;
      --cyan-soft: rgba(0, 240, 255, 0.14);
      --border-glass: rgba(0, 240, 255, 0.16);
      --border-bright: rgba(0, 240, 255, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-void);
      color: var(--text-primary);
      line-height: 1.65;
    }

    body {
      background-image:
        radial-gradient(circle at 12% 18%, rgba(37, 99, 235, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 88% 25%, rgba(0, 240, 255, 0.10) 0%, transparent 38%),
        radial-gradient(circle at 50% 85%, rgba(37, 99, 235, 0.12) 0%, transparent 48%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Faixa de Transparência Acadêmica (Slide 12, 18 e 19) */
    .academic-bar {
      background: rgba(7, 13, 27, 0.95);
      border-bottom: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.8rem;
      text-align: center;
      padding: 0.5rem 1rem;
      letter-spacing: 0.2px;
    }

    .academic-bar strong {
      color: var(--cyan-neon);
      font-weight: 600;
    }

    /* Cabeçalho Glassmorphism (RF02, RNF01, RNF03) */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(3, 6, 13, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-glass);
    }

    .nav-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(0, 240, 255, 0.2));
      border: 1px solid var(--border-bright);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
    }

    .brand span {
      background: linear-gradient(90deg, #ffffff, var(--cyan-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      position: relative;
      padding: 0.25rem 0;
      transition: var(--transition);
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--cyan-neon);
      box-shadow: 0 0 8px var(--cyan-neon);
      transition: width 0.25s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      color: var(--text-primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 1.35rem;
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Layout Base */
    section {
      max-width: 1180px;
      margin: 0 auto;
      padding: 5rem 1.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: var(--cyan-neon);
      background: var(--cyan-soft);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: clamp(1.85rem, 3.2vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.85rem;
      line-height: 1.2;
    }

    .lead {
      color: var(--text-secondary);
      font-size: 1.06rem;
      max-width: 680px;
      margin-bottom: 2.75rem;
    }

    /* Hero Section */
    .hero {
      padding: 6rem 1.5rem 5rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3.5rem;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 4.8vw, 3.65rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -1px;
      margin-bottom: 1.25rem;
    }

    .hero h1 .neon-text {
      background: linear-gradient(95deg, #38bdf8 0%, var(--cyan-neon) 60%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.25));
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 1.12rem;
      margin-bottom: 2.25rem;
      max-width: 550px;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--blue-electric), #06b6d4);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.96rem;
      padding: 0.9rem 1.75rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 240, 255, 0.35);
      border-color: var(--cyan-neon);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.96rem;
      padding: 0.9rem 1.75rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      border: 1px solid var(--border-glass);
      transition: var(--transition);
    }

    .btn-outline:hover {
      border-color: var(--cyan-neon);
      color: var(--cyan-neon);
      background: var(--bg-glass-hover);
    }

    /* Card Lateral do Hero (Estudo de Caso Deck) */
    .glass-panel {
      background: linear-gradient(155deg, rgba(15, 27, 54, 0.85), rgba(7, 13, 27, 0.9));
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 2.1rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.35rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .panel-header h3 {
      font-size: 1.02rem;
      color: var(--text-primary);
      font-weight: 700;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cyan-neon);
      background: var(--cyan-soft);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .scope-list {
      list-style: none;
      margin-bottom: 1.5rem;
    }

    .scope-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .scope-list li span.dot {
      color: var(--cyan-neon);
      font-weight: bold;
    }

    .scope-badges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .badge-box {
      background: rgba(3, 6, 13, 0.65);
      border: 1px solid rgba(37, 99, 235, 0.35);
      border-radius: var(--radius-md);
      padding: 0.85rem;
    }

    .badge-box strong {
      display: block;
      font-size: 0.95rem;
      color: var(--cyan-neon);
      margin-bottom: 0.15rem;
    }

    .badge-box small {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.3;
      display: block;
    }

    /* Grids e Cards Glass */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 1.9rem;
      transition: var(--transition);
