<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluxoInv | Gestão de Estoque</title>
<style>
:root {
  --navy:#10243e; --blue:#1769aa; --light:#edf4fa;
  --white:#fff; --text:#243449; --muted:#718096;
  --border:#dce5ee; --green:#16845b; --red:#d64b4b;
  --orange:#d88a22; --shadow:0 5px 20px #10243e12;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#10243e,#1769aa)}
.login-card{background:white;padding:38px;border-radius:16px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.logo{font-size:27px;font-weight:800;color:var(--navy);margin-bottom:8px}
.logo span{color:var(--blue)}
.login-card p{color:var(--muted);margin-bottom:25px}
.login-card label{display:block;font-size:13px;font-weight:bold;margin:16px 0 7px}
.login-card input,.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;outline:none;background:white}
input:focus,select:focus{border-color:var(--blue)}
.primary{background:var(--blue);color:white;padding:12px 17px;border-radius:8px;font-weight:bold}
.primary:hover{background:#12558c}
.login-card .primary{width:100%;margin-top:22px}
.hint{font-size:12px;color:var(--muted);margin-top:18px}
#app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:var(--navy);color:white;padding:25px 15px;z-index:5}
.sidebar .logo{color:white;padding:0 12px 28px}
.sidebar .logo span{color:#65b8ff}
.nav-title{font-size:10px;color:#9aabc0;text-transform:uppercase;letter-spacing:1.5px;padding:16px 12px 8px}
.nav button{width:100%;text-align:left;color:#dce7f4;background:transparent;padding:12px;border-radius:8px;margin:2px 0}
.nav button:hover,.nav button.active{background:#ffffff19;color:white}
.nav button span{display:inline-block;width:27px}
.userbox{position:absolute;bottom:20px;left:20px;right:20px;border-top:1px solid #ffffff25;padding-top:17px;font-size:13px}
.userbox small{display:block;color:#aabbd0;margin-top:4px}
.userbox button{background:transparent;color:white;margin-top:12px}
main{margin-left:245px;padding:30px;max-width:1600px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:15px}
.topbar h1{font-size:25px;color:var(--navy)}
.topbar p{color:var(--muted);font-size:13px;margin-top:6px}
.date{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.metric-label{font-size:13px;color:var(--muted)}
.metric{font-size:29px;font-weight:bold;color:var(--navy);margin-top:12px}
.metric-note{font-size:12px;color:var(--muted);margin-top:7px}
.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.panel h2{font-size:17px;color:var(--navy)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input,.toolbar select{padding:10px;border:1px solid var(--border);border-radius:8px;min-width:180px}
table{width:100%;border-collapse:collapse;min-width:650px}
.table-wrap{overflow-x:auto}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px;border-bottom:1px solid var(--border)}
td{padding:13px 12px;border-bottom:1px solid #edf1f5;font-size:13px}
tr:last-child td{border-bottom:0}
.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:bold;background:#edf2f7;color:#526174}
.status.green{background:#e4f5ed;color:#16845b}
.status.red{background:#fdeaea;color:#c33e3e}
.status.orange{background:#fff3df;color:#a86a12}
.actions{display:flex;gap:7px}
.small-btn{padding:7px 9px;border-radius:6px;background:var(--light);color:var(--blue);font-size:12px}
.small-btn.delete{background:#fdeaea;color:#c33e3e}
.page{display:none}
.page.active{display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.empty{text-align:center;color:var(--muted);padding:25px}
.modal-bg{position:fixed;inset:0;background:#07182bb3;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:14px;padding:25px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h2{font-size:19px;color:var(--navy)}
.close{background:#edf2f7;padding:7px 10px;border-radius:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:7px}
.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.secondary{padding:11px 15px;border-radius:8px;background:#edf2f7;color:var(--text)}
.toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:13px 18px;border-radius:9px;z-index:20;box-shadow:var(--shadow)}
.menu-mobile{display:none;background:var(--navy);color:white;padding:10px 13px;border-radius:8px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
 .sidebar{transform:translateX(-100%);transition:.2s}
 .sidebar.open{transform:translateX(0)}
 main{margin-left:0;padding:20px 14px}
 .menu-mobile{display:block}
  <section class="page active" id="dashboard">...</section>
  <section class="page" id="materials">...</section>
  <section class="page" id="movements">...</section>
  <section class="page" id="orders">...</section>
  <section class="page" id="inventory">...</section>
  <section class="page" id="employees">...</section>
 </main>
</div>

<div class="modal-bg" id="modalBg">...</div>
<div id="toast" class="toast hidden"></div>
 .topbar{align-items:flex-start}
 .date{display:none}
 .two-col{grid-template-columns:1fr}
}
@media(max-width:450px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<!-- Estrutura HTML completa contendo tela de login, barra lateral, dashboard, tabelas de materiais, movimentações, ordens de serviço, inventário e funcionários, conforme o código original. -->
</body>
</html>
<script src="https://jsdelivr.net"></script>
<script>
const SUPABASE_URL = 'https://supabase.co';
const SUPABASE_KEY = 'sb_publishable_2lz9uHJ72Mgj_BxJrEy2Ng_YKl3XHKN';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = id => document.getElementById(id);

let materials = [];
let employees = [];
let movements = [];
let orders = [];
let counts = [];

function toast(msg) {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3500);
}

async function loadAllData() {
  if (!db) {
    toast('Erro: Biblioteca do Supabase não carregou.');
    return;
  }
  toast('Sincronizando com o banco de dados...');
  try {
    const [resMat, resEmp, resMov, resOrd, resCnt] = await Promise.all([
      db.from('materials').select('*').order('id'),
      db.from('employees').select('*').order('id'),
      db.from('movements').select('*').order('id'),
      db.from('orders').select('*').order('id'),
      db.from('counts').select('*').order('id')
    ]);

    if (resMat.error) throw resMat.error;
    if (resEmp.error) throw resEmp.error;

    materials = resMat.data || [];
    employees = resEmp.data || [];
    movements = resMov.data || [];
    orders = resOrd.data || [];
    counts = resCnt.data || [];

    renderAll();
    toast('Banco de dados conectado!');
  } catch (err) {
    console.error('Erro Supabase:', err);
    toast('Erro no banco: ' + (err.message || 'verifique a conexão'));
  }
}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function materialName(id){return materials.find(x=>x.id==id)?.name||'Material removido';}
function employeeName(id){return employees.find(x=>x.id==id)?.name||'Não informado';}
function dateBR(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';}
function statusClass(s){return s==='Concluída'||s==='Ativo'?'green':s==='Cancelada'||s==='Inativo'?'red':s==='Em andamento'?'orange':'';}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('username').value.trim();
  const pass = $('password').value.trim();
  if (user === 'admin' && pass === 'fluxo123') {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await loadAllData();
  } else {
    toast('Usuário ou senha incorretos.');
  }
});

function logout(){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';}
function toggleMenu(){$('sidebar').classList.toggle('open');}

const titles={
  dashboard:['Dashboard','Visão geral da gestão de estoque'],
  materials:['Materiais','Cadastro e controle dos materiais'],
  movements:['Movimentações','Entradas e saídas do estoque'],
  orders:['Ordens de serviço','Acompanhamento das atividades'],
  inventory:['Inventário','Conferência física dos materiais'],
  employees:['Funcionários','Gerenciamento da equipe']
};

document.querySelectorAll('.nav button[data-page]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(btn.dataset.page).classList.add('active');
  $('pageTitle').textContent=titles[btn.dataset.page][0];
  $('pageSubtitle').textContent=titles[btn.dataset.page][1];
  $('sidebar').classList.remove('open');
}));

function renderAll(){
  $('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  renderDashboard();renderMaterials();renderMovements();renderOrders();renderInventory();renderEmployees();
}

function renderDashboard(){
  const low=materials.filter(m=>Number(m.qty)<=Number(m.min));
  const total=materials.reduce((a,m)=>a+Number(m.qty),0);
  $('metrics').innerHTML=[
    ['Materiais cadastrados',materials.length,'Itens registrados'],
    ['Quantidade em estoque',total.toLocaleString('pt-BR'),'Unidades somadas'],
    ['Estoque baixo',low.length,'Materiais que precisam de atenção'],
    ['Ordens abertas',orders.filter(o=>o.status!=='Concluída'&&o.status!=='Cancelada').length,'Ordens em andamento ou abertas']
  ].map(x=>`<div class="card"><div class="metric-label">${x[0]}</div><div class="metric">${x[1]}</div><div class="metric-note">${x[2]}</div></div>`).join('');
  $('lowStock').innerHTML=low.length?low.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.qty} ${esc(m.unit)}</td><td>${m.min} ${esc(m.unit)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Nenhum alerta de estoque.</td></tr>';
  $('recentMoves').innerHTML=movements.slice().sort((a,b)=>b.id-a.id).slice(0,5).map(m=>`<tr><td>${esc(materialName(m.materialId))}</td><td><span class="status ${m.type==='Entrada'?'green':'orange'}">${m.type}</span></td><td>${m.qty}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem movimentações.</td></tr>';
  $('activeOrders').innerHTML=orders.filter(o=>o.status!=='Concluída'&&o.status!=='Cancelada').map(o=>`<tr><td>${esc(o.code)}</td><td>${esc(o.description)}</td><td>${esc(employeeName(o.employeeId))}</td><td><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma ordem ativa.</td></tr>';
}

function renderMaterials(){
  const q=($('materialSearch')?.value||'').toLowerCase();
  const list=materials.filter(m=>(m.name+' '+m.code+' '+m.category).toLowerCase().includes(q));
  $('materialsTable').innerHTML=list.map(m=>`<tr>
  <td>${esc(m.code)}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.category)}</td>
  <td>${m.qty} ${esc(m.unit)}</td><td>${m.min} ${esc(m.unit)}</td>
  <td><span class="status ${Number(m.qty)<=Number(m.min)?'red':'green'}">${Number(m.qty)<=Number(m.min)?'Estoque baixo':'Normal'}</span></td>
  <td><div class="actions"><button class="small-btn" onclick="editItem('material',${m.id})">Editar</button><button class="small-btn delete" onclick="removeItem('material',${m.id})">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum material encontrado.</td></tr>';
}

function renderMovements(){
  $('movementsTable').innerHTML=movements.slice().sort((a,b)=>b.id-a.id).map(m=>`<tr><td>${dateBR(m.date)}</td><td>${esc(materialName(m.materialId))}</td><td><span class="status ${m.type==='Entrada'?'green':'orange'}">${m.type}</span></td><td>${m.qty}</td><td>${esc(employeeName(m.employeeId))}</td><td>${esc(m.note||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma movimentação registrada.</td></tr>';
}

function renderOrders(){
  $('ordersTable').innerHTML=orders.map(o=>`<tr><td>${esc(o.code)}</td><td>${esc(o.description)}</td><td>${esc(materialName(o.materialId))}</td><td>${o.qty}</td><td>${esc(employeeName(o.employeeId))}</td><td><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></td><td><div class="actions"><button class="small-btn" onclick="editItem('order',${o.id})">Editar</button><button class="small-btn delete" onclick="removeItem('order',${o.id})">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma ordem cadastrada.</td></tr>';
}

function renderInventory(){
  $('inventoryTable').innerHTML=counts.slice().sort((a,b)=>b.id-a.id).map(c=>`<tr><td>${dateBR(c.date)}</td><td>${esc(materialName(c.materialId))}</td><td>${c.system}</td><td>${c.physical}</td><td><span class="status ${Number(c.system)===Number(c.physical)?'green':'orange'}">${c.physical-c.system>0?'+':''}${c.physical-c.system}</span></td><td>${esc(employeeName(c.employeeId))}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma contagem registrada.</td></tr>';
}

function renderEmployees(){
  $('employeesTable').innerHTML=employees.map(e=>`<tr><td>${esc(e.registration)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.role)}</td><td>${esc(e.sector)}</td><td>${esc(e.email)}</td><td><span class="status ${statusClass(e.status)}">${esc(e.status)}</span></td><td><div class="actions"><button class="small-btn" onclick="editItem('employee',${e.id})">Editar</button><button class="small-btn delete" onclick="removeItem('employee',${e.id})">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum funcionário cadastrado.</td></tr>';
}

let currentType='',editingId=null;
const fields={
  material:[
    ['code','Código','text'],['name','Nome do material','text'],['category','Categoria','text'],
    ['unit','Unidade (un, kg, L...)','text'],['qty','Quantidade em estoque','number'],['min','Estoque mínimo','number']
  ],
  employee:[
    ['registration','Matrícula','text'],['name','Nome completo','text'],['role','Cargo','text'],
    ['sector','Setor','text'],['email','E-mail','email'],['status','Status','select',['Ativo','Inativo']]
  ],
  order:[
    ['code','Código da ordem','text'],['description','Descrição','text'],['materialId','Material','material'],
    ['qty','Quantidade','number'],['employeeId','Responsável','employee'],
    ['status','Status','select',['Aberta','Em andamento','Concluída','Cancelada']]
  ],
  movement:[
    ['materialId','Material','material'],['type','Tipo','select',['Entrada','Saída']],
    ['qty','Quantidade','number'],['employeeId','Responsável','employee'],['note','Observação','text']
  ],
  count:[
    ['materialId','Material','material'],['physical','Quantidade contada','number'],['employeeId','Responsável','employee']
  ]
};

function makeField(f,value){
  const [key,label,type,options]=f;let control='';
  if(type==='select')control=`<select name="${key}" required>${options.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`;
